# Mic processing profiles. A channel's `profile:` selects one of these as
# its default DSP chain; any field can be overridden per-channel in
# studiobox.yaml. Designed so that "various quality" mics each get
# sensible treatment without hand-tuning every knob.
#
# Chain order per mic: HPF -> gate -> EQ -> de-esser -> compressor -> leveler (AGC)

profiles:
  # Catch-all baseline.
  generic:
    hpfHz: 80
    gate:
      enabled: true
      thresholdDb: -50
      rangeDb: -18
      attackMs: 3
      holdMs: 120
      releaseMs: 150
    eq:
      - { type: peaking, freq: 250, gainDb: -2, q: 1.0 }
      - { type: highshelf, freq: 8000, gainDb: 2 }
    deesser: { enabled: false, freq: 6500, thresholdDb: -28, ratio: 4 }
    compressor:
      { enabled: true, thresholdDb: -20, ratio: 3, kneeDb: 6, attackMs: 10, releaseMs: 120, makeupDb: 3 }
    leveler:
      { enabled: true, targetLufs: -23, maxGainDb: 18, rangeDb: 15, responseMs: 2000 }

  # Dynamic broadcast mic (SM7B / RE20 type): clean, low handling noise.
  dynamic-broadcast:
    hpfHz: 70
    gate:
      enabled: true
      thresholdDb: -52
      rangeDb: -15
      attackMs: 3
      holdMs: 150
      releaseMs: 180
    eq:
      - { type: peaking, freq: 200, gainDb: -1.5, q: 1.0 }
      - { type: peaking, freq: 4500, gainDb: 2, q: 0.8 }
      - { type: highshelf, freq: 10000, gainDb: 1.5 }
    deesser: { enabled: true, freq: 6500, thresholdDb: -26, ratio: 4 }
    compressor:
      { enabled: true, thresholdDb: -22, ratio: 3, kneeDb: 6, attackMs: 8, releaseMs: 140, makeupDb: 4 }
    leveler:
      { enabled: true, targetLufs: -23, maxGainDb: 18, rangeDb: 15, responseMs: 2000 }

  # Cheap lavalier / clip-on: thin, noisy, sibilant -> work harder.
  cheap-lav:
    hpfHz: 110
    gate:
      enabled: true
      thresholdDb: -46
      rangeDb: -20
      attackMs: 2
      holdMs: 100
      releaseMs: 140
    eq:
      - { type: peaking, freq: 400, gainDb: -3, q: 1.2 }
      - { type: peaking, freq: 3000, gainDb: 2.5, q: 0.9 }
      - { type: highshelf, freq: 9000, gainDb: 3 }
    deesser: { enabled: true, freq: 6000, thresholdDb: -24, ratio: 5 }
    compressor:
      { enabled: true, thresholdDb: -18, ratio: 4, kneeDb: 4, attackMs: 6, releaseMs: 110, makeupDb: 5 }
    leveler:
      { enabled: true, targetLufs: -23, maxGainDb: 20, rangeDb: 16, responseMs: 2000 }

  # Studio condenser: detailed, sensitive -> gentle, watch sibilance.
  condenser:
    hpfHz: 80
    gate:
      enabled: true
      thresholdDb: -54
      rangeDb: -14
      attackMs: 4
      holdMs: 160
      releaseMs: 200
    eq:
      - { type: peaking, freq: 300, gainDb: -1.5, q: 1.0 }
      - { type: highshelf, freq: 11000, gainDb: 1 }
    deesser: { enabled: true, freq: 7000, thresholdDb: -28, ratio: 4 }
    compressor:
      { enabled: true, thresholdDb: -24, ratio: 2.5, kneeDb: 8, attackMs: 12, releaseMs: 150, makeupDb: 3 }
    leveler:
      { enabled: true, targetLufs: -23, maxGainDb: 15, rangeDb: 14, responseMs: 2500 }
